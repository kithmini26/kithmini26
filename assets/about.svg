<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="About me: final-year Software Engineering student at SLTC, IEEE CS Chairperson, GPA 3.64, graduating February 2027" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity=".045"/></pattern>
<linearGradient id="nameGrad" x1="0" x2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
<linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
<radialGradient id="glowV" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#8B5CF6" stop-opacity=".28"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
<radialGradient id="glowC" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#22D3EE" stop-opacity=".20"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
<clipPath id="panelClip"><rect x="10" y="10" width="1180" height="400" rx="22"/></clipPath>

</defs>
<style>
.sans{font-family:'Segoe UI',Inter,-apple-system,'Helvetica Neue',Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,Menlo,monospace}
.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.7)}}
.frame{animation:draw 1.8s .1s cubic-bezier(.6,0,.2,1) both}
@keyframes draw{from{stroke-dasharray:3600;stroke-dashoffset:3600}to{stroke-dasharray:3600;stroke-dashoffset:0}}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.pop{animation:pop .45s cubic-bezier(.2,.9,.3,1.4) both;transform-box:fill-box;transform-origin:center}
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
.tile{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}</style>
<rect x="10" y="10" width="1180" height="400" rx="22" fill="#070B14"/>
<rect x="10" y="10" width="1180" height="400" fill="url(#dots)" clip-path="url(#panelClip)"/>
<g clip-path="url(#panelClip)">
<ellipse cx="200" cy="357.0" rx="360" ry="260" fill="url(#glowV)"/>
<ellipse cx="1030" cy="63.0" rx="340" ry="240" fill="url(#glowC)"/>
</g>
<rect class="frame" x="11" y="11" width="1178" height="398" rx="21" fill="none" stroke="url(#nameGrad)" stroke-width="1.5" stroke-opacity=".75"/>
<text class="mono" x="60" y="62" fill="#8B5CF6" font-size="14" letter-spacing="3">// 02</text><text class="sans" x="58" y="108" fill="#E6EEFF" font-size="34" font-weight="800">About me</text><rect x="60" y="120" width="60" height="4" rx="2" fill="url(#nameGrad)"/><text class="sans rise" style="animation-delay:0.2s" x="60" y="170" fill="#AFC1E6" font-size="18">Final-year BSc (Hons) Software Engineering student at SLTC.</text><text class="sans rise" style="animation-delay:0.32s" x="60" y="200" fill="#AFC1E6" font-size="18">I test software, analyse data and build AI systems whose</text><text class="sans rise" style="animation-delay:0.44s" x="60" y="230" fill="#AFC1E6" font-size="18">decisions people can understand and trust.</text><text class="sans rise" style="animation-delay:0.56s" x="60" y="260" fill="#AFC1E6" font-size="18">As Chairperson of the IEEE Computer Society chapter,</text><text class="sans rise" style="animation-delay:0.6799999999999999s" x="60" y="290" fill="#AFC1E6" font-size="18">I lead events, teams and a growing student community.</text><g class="rise" style="animation-delay:0.9s"><rect x="60" y="346" width="145" height="28" rx="14" fill="#34D399" fill-opacity="0.12" stroke="#34D399" stroke-opacity=".55"/><text class="sans" x="132.5" y="365" fill="#E6EEFF" font-size="13" text-anchor="middle">Quality Assurance</text></g><g class="rise" style="animation-delay:1.02s"><rect x="215" y="346" width="117" height="28" rx="14" fill="#FBBF24" fill-opacity="0.12" stroke="#FBBF24" stroke-opacity=".55"/><text class="sans" x="273.5" y="365" fill="#E6EEFF" font-size="13" text-anchor="middle">Data Analysis</text></g><g class="rise" style="animation-delay:1.1400000000000001s"><rect x="342" y="346" width="124" height="28" rx="14" fill="#8B5CF6" fill-opacity="0.12" stroke="#8B5CF6" stroke-opacity=".55"/><text class="sans" x="404.0" y="365" fill="#E6EEFF" font-size="13" text-anchor="middle">Explainable AI</text></g><g class="rise" style="animation-delay:1.26s"><rect x="476" y="346" width="152" height="28" rx="14" fill="#22D3EE" fill-opacity="0.12" stroke="#22D3EE" stroke-opacity=".55"/><text class="sans" x="552.0" y="365" fill="#E6EEFF" font-size="13" text-anchor="middle">Project Management</text></g><g class="tile" style="animation-delay:0.3s"><rect x="700" y="100" width="210" height="128" rx="16" fill="#0B1222" stroke="#22D3EE" stroke-opacity=".4"/><rect x="720" y="120" width="28" height="4" rx="2" fill="#22D3EE"/><text class="sans" x="720" y="174" fill="#22D3EE" font-size="30" font-weight="800">3.64</text><text class="mono" x="720" y="204" fill="#7C8DB5" font-size="11" letter-spacing="2">GPA</text></g><g class="tile" style="animation-delay:0.44999999999999996s"><rect x="930" y="100" width="210" height="128" rx="16" fill="#0B1222" stroke="#34D399" stroke-opacity=".4"/><rect x="950" y="120" width="28" height="4" rx="2" fill="#34D399"/><text class="sans" x="950" y="174" fill="#34D399" font-size="30" font-weight="800">Feb 2027</text><text class="mono" x="950" y="204" fill="#7C8DB5" font-size="11" letter-spacing="2">GRADUATION</text></g><g class="tile" style="animation-delay:0.6s"><rect x="700" y="250" width="210" height="128" rx="16" fill="#0B1222" stroke="#FBBF24" stroke-opacity=".4"/><rect x="720" y="270" width="28" height="4" rx="2" fill="#FBBF24"/><text class="sans" x="720" y="324" fill="#FBBF24" font-size="30" font-weight="800">6</text><text class="mono" x="720" y="354" fill="#7C8DB5" font-size="11" letter-spacing="2">FEATURED PROJECTS</text></g><g class="tile" style="animation-delay:0.75s"><rect x="930" y="250" width="210" height="128" rx="16" fill="#0B1222" stroke="#8B5CF6" stroke-opacity=".4"/><rect x="950" y="270" width="28" height="4" rx="2" fill="#8B5CF6"/><text class="sans" x="950" y="324" fill="#8B5CF6" font-size="30" font-weight="800">2025/26</text><text class="mono" x="950" y="354" fill="#7C8DB5" font-size="11" letter-spacing="2">IEEE CS CHAIRPERSON</text></g>
</svg>