<text x="40" y="130" fill="#C8DEFF" font-size="16" font-family="'Segoe UI', Helvetica, Arial, sans-serif">Final-year BSc (Hons) Software Engineering undergraduate at SLTC (GPA 3.64), graduating February 2027.</text><text x="40" y="160" fill="#C8DEFF" font-size="16" font-family="'Segoe UI', Helvetica, Arial, sans-serif">I work across Quality Assurance, Data Analysis and Explainable AI.</text><text x="40" y="190" fill="#C8DEFF" font-size="16" font-family="'Segoe UI', Helvetica, Arial, sans-serif">Chairperson of the IEEE Computer Society Student Branch Chapter, SLTC (2025/26).</text><text x="40" y="220" fill="#C8DEFF" font-size="16" font-family="'Segoe UI', Helvetica, Arial, sans-serif">Looking for an internship in QA, Data Analysis, Business Analysis or Project Management.</text>
