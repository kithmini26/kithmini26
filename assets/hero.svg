<style>
.sans{font-family:'Segoe UI',Inter,-apple-system,'Helvetica Neue',Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,Menlo,monospace}
.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.7)}}
.frame{animation:draw 1.8s .1s cubic-bezier(.6,0,.2,1) both}
@keyframes draw{from{stroke-dasharray:3600;stroke-dashoffset:3600}to{stroke-dasharray:3600;stroke-dashoffset:0}}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.pop{animation:pop .45s cubic-bezier(.2,.9,.3,1.4) both;transform-box:fill-box;transform-origin:center}
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}

.tick{animation:pop .45s cubic-bezier(.2,.9,.3,1.4) both;transform-box:fill-box;transform-origin:center}
.bar{transform-box:fill-box;transform-origin:bottom;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.scan{opacity:0;animation:scan 4.5s ease-in-out 2.6s infinite}
@keyframes scan{0%{transform:translateY(0);opacity:0}10%{opacity:.9}90%{opacity:.9}100%{transform:translateY(190px);opacity:0}}
.prog{animation:prog 6s ease-in-out 2s infinite}
@keyframes prog{0%{width:0}60%,90%{width:402px}100%{width:0}}
</style>
