<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Have a QA or data role in mind? Let's connect." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity=".045"/></pattern>
<linearGradient id="nameGrad" x1="0" x2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
<linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
<radialGradient id="glowV" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#8B5CF6" stop-opacity=".28"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
<radialGradient id="glowC" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#22D3EE" stop-opacity=".20"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
<clipPath id="panelClip"><rect x="10" y="10" width="1180" height="260" rx="22"/></clipPath>

</defs>
<style>
.sans{font-family:'Segoe UI',Inter,-apple-system,'Helvetica Neue',Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,Menlo,monospace}
.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.7)}}
.frame{animation:draw 1.8s .1s cubic-bezier(.6,0,.2,1) both}
@keyframes draw{from{stroke-dasharray:3600;stroke-dashoffset:3600}to{stroke-dasharray:3600;stroke-dashoffset:0}}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.pop{animation:pop .45s cubic-bezier(.2,.9,.3,1.4) both;transform-box:fill-box;transform-origin:center}
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}

.ring{transform-box:fill-box;transform-origin:center;animation:ring 3s ease-out infinite}
@keyframes ring{0%{transform:scale(.55);opacity:.7}100%{transform:scale(1.5);opacity:0}}
.float{animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
</style>
<rect x="10" y="10" width="1180" height="260" rx="22" fill="#070B14"/>
<rect x="10" y="10" width="1180" height="260" fill="url(#dots)" clip-path="url(#panelClip)"/>
<g clip-path="url(#panelClip)">
<ellipse cx="200" cy="238.0" rx="360" ry="260" fill="url(#glowV)"/>
<ellipse cx="1030" cy="42.0" rx="340" ry="240" fill="url(#glowC)"/>
</g>
<rect class="frame" x="11" y="11" width="1178" height="258" rx="21" fill="none" stroke="url(#nameGrad)" stroke-width="1.5" stroke-opacity=".75"/>
<text class="mono" x="60" y="66" fill="#8B5CF6" font-size="14" letter-spacing="3">// 06 · CONNECT</text><text class="sans rise" x="58" y="124" fill="#E6EEFF" font-size="40" font-weight="800">Have a QA or data role in mind?</text><text class="sans rise" style="animation-delay:.2s" x="60" y="160" fill="#AFC1E6" font-size="19">Let's talk. I'm looking for internships in QA, data and analysis.</text><g class="rise" style="animation-delay:.4s"><rect x="60" y="186" width="400" height="46" rx="23" fill="#0B1222" stroke="url(#nameGrad)" stroke-width="1.5"/><circle cx="90" cy="209" r="5" fill="#34D399" class="pulse"/><text class="mono" x="108" y="214" fill="#E6EEFF" font-size="15">dissanayakekithmini@gmail.com</text></g><circle class="ring" style="animation-delay:0s" cx="980" cy="140" r="62" fill="none" stroke="#22D3EE" stroke-width="1.5"/><circle class="ring" style="animation-delay:1s" cx="980" cy="140" r="62" fill="none" stroke="#22D3EE" stroke-width="1.5"/><circle class="ring" style="animation-delay:2s" cx="980" cy="140" r="62" fill="none" stroke="#22D3EE" stroke-width="1.5"/><circle cx="980" cy="140" r="58" fill="#0B1222" stroke="url(#nameGrad)" stroke-width="2"/><g class="float"><rect x="954" y="122" width="52" height="36" rx="6" fill="none" stroke="#E6EEFF" stroke-width="2.4"/><path d="M954 126 L980 146 L1006 126" fill="none" stroke="#22D3EE" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/></g>
</svg>