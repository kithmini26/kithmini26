<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="28" viewBox="0 0 1200 28" role="presentation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="beam" x1="0" x2="1"><stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></linearGradient>
<clipPath id="track"><rect x="40" y="11" width="1120" height="6"/></clipPath>
</defs>
<style>
.beam{animation:sweep 3s linear infinite}
@keyframes sweep{from{transform:translateX(-500px)}to{transform:translateX(1200px)}}
.dia{animation:dia 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes dia{0%,100%{transform:rotate(45deg) scale(1)}50%{transform:rotate(225deg) scale(1.25)}}
.dot{animation:dp 1.8s ease-in-out infinite}
@keyframes dp{0%,100%{opacity:.3}50%{opacity:1}}
</style>
<line x1="40" y1="14" x2="1160" y2="14" stroke="#1B2540" stroke-width="1.5"/>
<g clip-path="url(#track)"><rect class="beam" x="40" y="11" width="500" height="6" fill="url(#beam)"/></g>
<rect class="dia" x="594" y="8" width="12" height="12" fill="#8B5CF6"/>
<circle class="dot" cx="560" cy="14" r="2.5" fill="#22D3EE"/><circle class="dot" style="animation-delay:.3s" cx="540" cy="14" r="2" fill="#22D3EE"/>
<circle class="dot" cx="640" cy="14" r="2.5" fill="#22D3EE"/><circle class="dot" style="animation-delay:.3s" cx="660" cy="14" r="2" fill="#22D3EE"/>
</svg>